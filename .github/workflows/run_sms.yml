name: Get One SMS

# Позволяет запускать скрипт вручную одной кнопкой
on:
  workflow_dispatch:

jobs:
  get-sms:
    runs-on: ubuntu-latest

    steps:
    # 1. Скачиваем ваш код из репозитория
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Устанавливаем Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Устанавливаем библиотеку для запросов
    - name: Install dependencies
      run: pip install requests

    # 4. Запускаем сам скрипт на 6 минут
    - name: Run SMS Script
      env:
        # Передаем ваш секретный API ключ в скрипт, чтобы не светить его в коде
        SMS_API_KEY: ${{ secrets.SMS_API_KEY }} 
      run: python sms_getter.py
